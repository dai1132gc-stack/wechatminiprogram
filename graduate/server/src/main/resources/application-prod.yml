# 生产环境：全部经环境变量注入，禁止在此文件出现任何真实密钥
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

logging:
  level:
    com.rentalplatform: info

rental:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 120
    refresh-ttl-days: 7
  wechat:
    appid: ${WX_APPID}
    secret: ${WX_SECRET}
