# 公共配置（环境差异见 application-{dev|test|prod}.yml）
server:
  port: 8080
  servlet:
    context-path: /api/v1   # 与前端 baseURL 及 openapi.yaml servers 对齐

spring:
  profiles:
    active: dev
  jackson:
    # 时间序列化 ISO-8601 带时区（技术方案 §2.5 数据类型约定）
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Shanghai
    default-property-inclusion: always   # data 为 null 也输出，不省略字段
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # snake_case → camelCase 自动转换
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:mapper/*.xml

# Knife4j（W1 骨架即开启，便于前后端对照契约）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn
